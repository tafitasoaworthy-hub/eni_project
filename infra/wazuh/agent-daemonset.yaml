apiVersion: v1
kind: Namespace
metadata:
  name: wazuh-agent
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: wazuh-agent
  namespace: wazuh-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: wazuh-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wazuh-agent
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: wazuh-agent
          image: wazuh/wazuh-agent:4.14.10
          imagePullPolicy: IfNotPresent
          env:
            - name: WAZUH_MANAGER
              valueFrom:
                secretKeyRef:
                  name: wazuh-agent-config
                  key: manager-address
            - name: WAZUH_REGISTRATION_SERVER
              valueFrom:
                secretKeyRef:
                  name: wazuh-agent-config
                  key: registration-address
            - name: WAZUH_REGISTRATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wazuh-agent-config
                  key: enrollment-password
            - name: WAZUH_AGENT_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
