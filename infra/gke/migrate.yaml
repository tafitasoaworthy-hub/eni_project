apiVersion: batch/v1
kind: Job
metadata:
  name: eni-migrate-IMAGE_TAG
  namespace: eni
  annotations:
    checkov.io/skip1: CKV_K8S_14=CI replaces the image placeholder with a versioned image tag derived from the commit SHA.
    checkov.io/skip2: CKV_K8S_43=CI replaces the image placeholder with a versioned image tag derived from the commit SHA.
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: migrations
    spec:
      serviceAccountName: eni-openai-reader
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: Never
      containers:
      - name: migrate
        image: BACKEND_IMAGE
        command: [python, manage.py, migrate, --noinput]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        envFrom:
        - configMapRef:
            name: eni-runtime
        env:
        - name: OPENAI_API_KEY_FILE
          value: /run/secrets-manager/OPENAI_API_KEY
        volumeMounts:
          - name: tmp
            mountPath: /tmp
          - name: app-secrets
            mountPath: /run/secrets
            readOnly: true
          - name: openai-secret
            mountPath: /run/secrets-manager
            readOnly: true
        resources:
          requests: {cpu: 250m, memory: 512Mi}
          limits: {cpu: 1, memory: 1Gi}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: app-secrets
          projected:
            sources:
            - secret:
                name: eni-runtime
                items:
                - key: DJANGO_SECRET_KEY
                  path: DJANGO_SECRET_KEY
            - secret:
                name: eni-postgres
                items:
                - key: POSTGRES_PASSWORD
                  path: POSTGRES_PASSWORD
        - name: openai-secret
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: eni-openai-key
