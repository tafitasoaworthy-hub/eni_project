apiVersion: batch/v1
kind: Job
metadata:
  name: eni-migrate-IMAGE_TAG
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: migrations
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: Never
      containers:
      - name: migrate
        #checkov:skip=CKV_K8S_14:CI replaces this placeholder with the full commit SHA image tag
        #checkov:skip=CKV_K8S_43:CI assigns the image a unique full-SHA tag; Checkov scans this template before image resolution
        image: BACKEND_IMAGE
        command: [python, manage.py, migrate, --noinput]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        envFrom:
        - configMapRef:
            name: eni-runtime
        - secretRef:
            name: eni-runtime
        - secretRef:
            name: eni-postgres
        resources:
          requests: {cpu: 250m, memory: 512Mi}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: eni-migrations-network-policy
spec:
  podSelector:
    matchLabels:
      app: migrations
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
