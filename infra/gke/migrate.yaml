apiVersion: batch/v1
kind: Job
metadata:
  name: eni-migrate-IMAGE_TAG
  namespace: eni
  annotations:
    checkov.io/skip1: CKV_K8S_14=CI replaces the image placeholder with a versioned image tag derived from the commit SHA.
    checkov.io/skip2: CKV_K8S_43=CI replaces the image placeholder with a versioned image tag derived from the commit SHA.
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: migrations
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: Never
      containers:
      - name: migrate
        image: BACKEND_IMAGE
        command: [python, manage.py, migrate, --noinput]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        envFrom:
        - configMapRef:
            name: eni-runtime
        volumeMounts:
          - name: tmp
            mountPath: /tmp
          - name: app-secrets
            mountPath: /run/secrets
            readOnly: true
        resources:
          requests: {cpu: 250m, memory: 512Mi}
          limits: {cpu: 1, memory: 1Gi}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: app-secrets
          projected:
            sources:
            - secret:
                name: eni-runtime
                items:
                - key: DJANGO_SECRET_KEY
                  path: DJANGO_SECRET_KEY
                - key: OPENAI_API_KEY
                  path: OPENAI_API_KEY
            - secret:
                name: eni-postgres
                items:
                - key: POSTGRES_PASSWORD
                  path: POSTGRES_PASSWORD
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: eni-migrations-network-policy
  namespace: eni
spec:
  podSelector:
    matchLabels:
      app: migrations
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
