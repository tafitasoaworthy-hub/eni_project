#checkov:skip=CKV_K8S_14:CI replaces the image placeholder with the full commit SHA tag
#checkov:skip=CKV_K8S_43:Checkov scans the template before CI resolves the unique commit-SHA image
#checkov:skip=CKV_K8S_35:Django and PostgreSQL currently consume these Kubernetes Secret values through environment variables
apiVersion: batch/v1
kind: Job
metadata:
  name: eni-migrate-IMAGE_TAG
  namespace: eni
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: migrations
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: Never
      containers:
      - name: migrate
        image: BACKEND_IMAGE
        command: [python, manage.py, migrate, --noinput]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        volumeMounts:
          - name: tmp
            mountPath: /tmp
        envFrom:
        - configMapRef:
            name: eni-runtime
        - secretRef:
            name: eni-runtime
        - secretRef:
            name: eni-postgres
        resources:
          requests: {cpu: 250m, memory: 512Mi}
          limits: {cpu: 1, memory: 1Gi}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: eni-migrations-network-policy
  namespace: eni
spec:
  podSelector:
    matchLabels:
      app: migrations
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
