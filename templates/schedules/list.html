{% extends "base.html" %}
{% block page_title %}Emplois du temps{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <div>
    <span class="text-muted small">{{ total }} séance(s)</span>
    {% if conflicts %}<span class="badge bg-danger ms-2"><i class="fa-solid fa-triangle-exclamation me-1"></i>{{ conflicts }} conflit(s) détecté(s)</span>{% endif %}
  </div>
  <a href="{% url 'schedules:create' %}" class="btn btn-primary btn-sm"><i class="fa-solid fa-plus me-1"></i>Nouvelle séance</a>
</div>
<form class="card p-3 mb-3" method="get">
  <div class="row g-2">
    <div class="col-md-3"><select name="annee" class="form-select"><option value="">Année courante</option>
      {% for a in annees %}<option value="{{ a.pk }}" {% if annee == a.pk|stringformat:'s' %}selected{% endif %}>{{ a.libelle }}</option>{% endfor %}</select></div>
    <div class="col-md-3"><select name="filiere" class="form-select"><option value="">Toutes filières</option>
      {% for f in filieres %}<option value="{{ f.pk }}" {% if filiere == f.pk|stringformat:'s' %}selected{% endif %}>{{ f.nom }}</option>{% endfor %}</select></div>
    <div class="col-md-2"><select name="niveau" class="form-select"><option value="">Niveau</option>
      {% for n in niveaux %}<option value="{{ n.pk }}" {% if niveau == n.pk|stringformat:'s' %}selected{% endif %}>{{ n.code }}</option>{% endfor %}</select></div>
    <div class="col-md-2"><select name="enseignant" class="form-select"><option value="">Enseignant</option>
      {% for t in enseignants %}<option value="{{ t.pk }}" {% if enseignant == t.pk|stringformat:'s' %}selected{% endif %}>{{ t.full_name }}</option>{% endfor %}</select></div>
    <div class="col-md-2"><button class="btn btn-outline-primary w-100">Filtrer</button></div>
  </div>
</form>
{% include "schedules/_grid.html" %}
{% endblock %}
