{% extends "base.html" %}
{% load static %}
{% block title %}Lien envoyé{% endblock %}
{% block fullpage %}
<div class="login-wrap"><div class="login-card text-center">
  <img src="{% static 'img/logo.jpg' %}" class="logo mb-3" alt="logo">
  <h5 style="color:var(--primary)">E-mail envoyé</h5>
  <p class="small text-muted">Si un compte correspond à cette adresse, un lien de réinitialisation a été envoyé. En développement, consultez la console du serveur.</p>
  <a href="{% url 'accounts:login' %}" class="btn btn-primary w-100">Retour à la connexion</a>
</div></div>
{% endblock %}
