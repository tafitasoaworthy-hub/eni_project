{% extends "base.html" %}
{% block page_title %}Nouvelle demande de document{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7"><div class="card p-4">
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <div class="mb-3"><label class="form-label small fw-semibold">{{ field.label }}</label>{{ field }}
        {% if field.errors %}<div class="text-danger small">{{ field.errors|striptags }}</div>{% endif %}</div>
    {% endfor %}
    <button class="btn btn-primary"><i class="fa-solid fa-floppy-disk me-1"></i>Enregistrer la demande</button>
    <a href="{% url 'documents:request_list' %}" class="btn btn-light">Annuler</a>
  </form>
</div></div></div>
{% endblock %}
