{% extends "base.html" %}
{% block page_title %}Archivage{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
  <div class="card p-4 text-center">
    <div class="mb-3"><i class="fa-solid fa-box-archive fa-2x text-warning"></i></div>
    <h5>{% if obj.archived %}Restaurer{% else %}Archiver{% endif %} ce {{ type }} ?</h5>
    <p class="text-muted">{{ obj }}</p>
    <form method="post" class="d-inline">
      {% csrf_token %}
      <a href="{% url back %}" class="btn btn-light">Annuler</a>
      <button class="btn btn-warning">{% if obj.archived %}Restaurer{% else %}Archiver{% endif %}</button>
    </form>
  </div>
</div></div>
{% endblock %}
