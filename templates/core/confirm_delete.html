{% extends "base.html" %}
{% block page_title %}Suppression{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
  <div class="card p-4 text-center">
    <div class="mb-3"><i class="fa-solid fa-triangle-exclamation fa-2x text-danger"></i></div>
    <h5>Supprimer définitivement ce {{ type }} ?</h5>
    <p class="text-muted">{{ obj }}</p>
    <p class="small text-danger">Cette action est irréversible.</p>
    <form method="post" class="d-inline">
      {% csrf_token %}
      <a href="{% url back %}" class="btn btn-light">Annuler</a>
      <button class="btn btn-danger">Supprimer définitivement</button>
    </form>
  </div>
</div></div>
{% endblock %}
